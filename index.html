<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Firmware 다운로드</title>
  <!-- Markdown → HTML 변환 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f6f8fa; }
    h1 { color: #24292f; }
    .project { background: white; border: 1px solid #d0d7de; border-radius: 8px; padding: 24px; margin: 16px 0; }
    .project-title { font-size: 1.3em; font-weight: bold; color: #24292f; margin: 0 0 4px 0; }
    .meta { color: #656d76; font-size: 0.9em; margin-bottom: 16px; }
    .release-note { background: #f6f8fa; border-radius: 6px; padding: 16px; margin: 12px 0; font-size: 0.95em; }
    .release-note h2 { font-size: 1em; margin: 12px 0 4px 0; }
    .release-note ul { margin: 4px 0; padding-left: 20px; }
    .release-note li { margin: 2px 0; }
    .download-btn {
      display: inline-block; background: #2da44e; color: white;
      padding: 8px 18px; border-radius: 6px; text-decoration: none;
      margin: 4px 4px 0 0; font-size: 0.95em;
    }
    .download-btn:hover { background: #218838; }
    .loading { color: #999; text-align: center; padding: 40px; }
    .error { color: #cc0000; padding: 12px; }
    .toggle-btn {
      background: none; border: 1px solid #d0d7de; border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-size: 0.85em; color: #656d76;
      margin-bottom: 8px;
    }
    .toggle-btn:hover { background: #f6f8fa; }
	
	.old-release {
	  border-top: 1px solid #d0d7de;
	  padding-top: 12px;
	  margin-top: 12px;
	}
	.old-meta {
	  color: #656d76;
	  font-size: 0.9em;
	  margin-bottom: 8px;
	}
	.download-btn.old {
	  background: #6e7781;  /* 이전 버전은 회색 버튼 */
	}
	.download-btn.old:hover { background: #57606a; }
  </style>
</head>
<body>
  <h1>⬇ Firmware 다운로드</h1>
  <p style="color:#656d76">각 프로젝트의 최신 펌웨어를 다운로드하세요.</p>
  <div id="container"><p class="loading">불러오는 중...</p></div>

  <script>
    const GITHUB_USER = 'hrkim91';  // ★ 본인 계정으로 변경
    const REPOS = [
      { id: 'GS1000_CPU_Firmware', name: 'GS1000 CPU Module' },
      { id: 'GS1000_RD_Firmware', name: 'GS1000 RD Module' },
      { id: 'projectC-firmware', name: 'Project C — LED Driver' },
    ];

    async function fetchRelease(repo) {
	  // latest → releases 로 변경 (전체 목록)
	  const url = `https://api.github.com/repos/${GITHUB_USER}/${repo.id}/releases`;
	  const res = await fetch(url);
	  if (!res.ok) throw new Error('릴리즈 없음');
	  return res.json();  // 배열로 반환됨
    }

	function renderProject(repo, releases) {
	  // 최신 버전 (첫번째 항목)
	  const latest = releases[0];
	  const date = new Date(latest.published_at).toLocaleDateString('ko-KR');

	  // 최신 버전 다운로드 버튼
	  const latestAssets = latest.assets.map(a =>
		`<a class="download-btn" href="${a.browser_download_url}">⬇ ${a.name}</a>`
	  ).join('');

	  // 최신 버전 릴리즈 노트
	  const latestNoteId = `note-${repo.id}-latest`;
	  const latestNoteHtml = latest.body
		? marked.parse(latest.body)
		: '<p style="color:#999">릴리즈 노트 없음</p>';

	  // 이전 버전 목록 (두번째 항목부터)
	  const olderReleases = releases.slice(1).map(release => {
		const oldDate = new Date(release.published_at).toLocaleDateString('ko-KR');
		const oldNoteId = `note-${repo.id}-${release.tag_name}`;
		const oldNoteHtml = release.body
		  ? marked.parse(release.body)
		  : '<p style="color:#999">릴리즈 노트 없음</p>';
		const oldAssets = release.assets.map(a =>
		  `<a class="download-btn old" href="${a.browser_download_url}">⬇ ${a.name}</a>`
		).join('');

		return `
		  <div class="old-release">
			<div class="old-meta">
			  ${release.tag_name} &nbsp;|&nbsp; ${oldDate}
			  <button class="toggle-btn" onclick="toggleNote('${oldNoteId}')">릴리즈 노트</button>
			</div>
			<div class="release-note" id="${oldNoteId}" style="display:none">${oldNoteHtml}</div>
			<div>${oldAssets}</div>
		  </div>`;
	  }).join('');

	  return `
		<div class="project">
		  <div class="project-title">${repo.name}</div>
		  <div class="meta">
			최신버전: <strong>${latest.tag_name}</strong>
			&nbsp;|&nbsp; 배포일: ${date}
		  </div>

		  <button class="toggle-btn" onclick="toggleNote('${latestNoteId}')">
			📋 릴리즈 노트 보기 / 닫기
		  </button>
		  <div class="release-note" id="${latestNoteId}" style="display:none">
			${latestNoteHtml}
		  </div>
		  <div style="margin-bottom:16px">${latestAssets}</div>

		  ${olderReleases.length > 0 ? `
			<details>
			  <summary style="cursor:pointer; color:#656d76; font-size:0.9em">
				이전 버전 (${releases.length - 1}개)
			  </summary>
			  <div style="margin-top:12px">${olderReleases}</div>
			</details>` : ''}
		</div>`;
	}

    function toggleNote(id) {
      const el = document.getElementById(id);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function init() {
      const container = document.getElementById('container');
      const results = await Promise.allSettled(REPOS.map(fetchRelease));

      container.innerHTML = results.map((result, i) => {
        if (result.status === 'fulfilled') {
          return renderProject(REPOS[i], result.value);
        } else {
          return `
            <div class="project">
              <div class="project-title">${REPOS[i].name}</div>
              <p class="error">릴리즈 정보를 불러올 수 없습니다.</p>
            </div>`;
        }
      }).join('');
    }

    init();
  </script>
</body>
</html>
