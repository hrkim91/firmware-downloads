<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firmware 다운로드</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f6f8fa;
      color: #24292f;
    }
    h1 { color: #24292f; margin-bottom: 4px; }
    .subtitle { color: #656d76; margin-bottom: 24px; font-size: 0.95em; }

    /* 2단 레이아웃: 좌측 카테고리 + 우측 카드 */
    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .sidebar {
      flex: 0 0 220px;
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      overflow: hidden;
      position: sticky;
      top: 40px;
    }
    .sidebar-title {
      padding: 14px 16px;
      font-weight: bold;
      border-bottom: 1px solid #d0d7de;
    }
    .category-list { list-style: none; margin: 0; padding: 8px; }
    .category-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95em;
    }
    .category-item:hover { background: #f6f8fa; }
    .category-item.active { background: #2f6fed; color: white; }
    .category-item.active .category-count { color: white; }
    .category-count { color: #999; font-size: 0.85em; }
    .content { flex: 1; min-width: 0; }

    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      .sidebar { flex: 0 0 auto; width: 100%; position: static; }
    }

    /* 로그인 게이트 */
    .login-gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
    }
    .login-box {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 32px;
      width: 320px;
    }
    .login-box h2 { margin: 0 0 16px 0; font-size: 1.2em; }
    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 0.95em;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      background: #2da44e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95em;
    }
    .login-box button:hover { background: #218838; }
    .login-error { color: #cc0000; font-size: 0.85em; margin-top: 8px; min-height: 1em; }

    .top-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: -8px; }
    .user-label { color: #656d76; font-size: 0.85em; }
    .logout-btn {
      background: none;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 0.85em;
      color: #656d76;
    }
    .logout-btn:hover { background: white; }

    /* 프로젝트 카드 */
    .project {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 24px;
      margin: 16px 0;
    }
    .project-title {
      font-size: 1.3em;
      font-weight: bold;
      color: #24292f;
      margin: 0 0 4px 0;
    }
    .meta {
      color: #656d76;
      font-size: 0.9em;
      margin-bottom: 16px;
    }

    /* 릴리즈 노트 */
    .release-note {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
      margin: 12px 0;
      font-size: 0.95em;
      line-height: 1.6;
    }
    .release-note h2 {
      font-size: 1em;
      margin: 12px 0 4px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid #d0d7de;
    }
    .release-note h2:first-child { margin-top: 0; }
    .release-note ul { margin: 4px 0; padding-left: 20px; }
    .release-note li { margin: 2px 0; }
    .release-note p { margin: 4px 0; }

    /* 버튼 공통 */
    .toggle-btn {
      background: none;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 0.85em;
      color: #656d76;
      margin-bottom: 8px;
      margin-right: 4px;
    }
    .toggle-btn:hover { background: #f6f8fa; }

    /* 다운로드 버튼 */
    .download-btn {
      display: inline-block;
      background: #2da44e;
      color: white;
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      margin: 4px 4px 0 0;
      font-size: 0.95em;
    }
    .download-btn:hover { background: #218838; }

    /* 이전 버전 다운로드 버튼 (회색) */
    .download-btn.old { background: #6e7781; }
    .download-btn.old:hover { background: #57606a; }

    /* 이전 버전 */
    .old-release {
      border-top: 1px solid #d0d7de;
      padding-top: 12px;
      margin-top: 12px;
    }
    .old-meta {
      color: #656d76;
      font-size: 0.9em;
      margin-bottom: 8px;
    }

    /* 이전 버전 펼치기 */
    details { margin-top: 16px; }
    details summary {
      cursor: pointer;
      color: #656d76;
      font-size: 0.9em;
      padding: 6px 0;
      user-select: none;
    }
    details summary:hover { color: #24292f; }

    /* 로딩 / 오류 */
    .loading { color: #999; text-align: center; padding: 40px; }
    .error-msg { color: #cc0000; padding: 12px; font-size: 0.9em; }

    /* 푸터 */
    .footer {
      text-align: center;
      color: #999;
      font-size: 0.8em;
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #d0d7de;
    }
  </style>
</head>
<body>

  <div id="loginGate" class="login-gate">
    <div class="login-box">
      <h2>로그인</h2>
      <input type="text" id="loginEmail" placeholder="아이디" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="비밀번호"
             onkeydown="if(event.key === 'Enter') login()">
      <button onclick="login()">로그인</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="appContent" style="display:none">
    <div class="top-bar">
      <span class="user-label" id="userLabel"></span>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>

    <h1>⬇ Firmware 다운로드</h1>
    <p class="subtitle">각 프로젝트의 최신 펌웨어를 다운로드하세요.</p>

    <div class="layout">
      <nav class="sidebar">
        <div class="sidebar-title">제품 카테고리</div>
        <ul class="category-list" id="categoryList"></ul>
      </nav>
      <main class="content">
        <div id="container">
          <p class="loading">불러오는 중...</p>
        </div>
      </main>
    </div>

    <div class="footer">
      페이지 새로고침 시 최신 버전이 자동으로 반영됩니다.
    </div>
  </div>

  <script>
    // ★ 본인 GitHub 계정명으로 변경
    const GITHUB_USER = 'hrkim91';

    // ★ 프로젝트 repo 목록 (id: GitHub repo명, name: 페이지에 표시될 이름, category: 좌측 카테고리)
    const REPOS = [
      { id: 'GS1000_CPU_Firmware',  name: 'GS1000 CPU Module',       category: 'GS1000' },
	    { id: 'GS1000_RD_Firmware',  name: 'GS1000 RD Module',        category: 'GS1000' },
	    { id: 'GSP120_SPack_Firmware',  name: 'GSP120 SPack Controller', category: 'GSP120' },
	    { id: 'G6_G12_Firmware',  name: 'G6_G12 Controller',          category: 'G6_G12' },
      { id: 'RGBW_Multi_RX_Firmware',  name: 'RGBW Multi RX Driver',  category: 'RGBW(Multi)' },
      { id: 'RGBW_Multi_TX_Firmware',  name: 'RGBW Multi TX Driver',  category: 'RGBW(Multi)' },
      { id: 'GR50A_Firmware',  name: 'GR50A Controller',             category: 'GR50' },
      { id: 'GR50B_Firmware',  name: 'GR50B Controller',             category: 'GR50' }
    ];

    // 카테고리 목록 (REPOS에 등장하는 순서대로, 중복 제거)
    const CATEGORIES = [...new Set(REPOS.map(r => r.category))];
    let activeCategory = CATEGORIES[0];
    let repoResults = []; // REPOS와 동일한 인덱스로 매칭되는 fetch 결과

    // --------------------------------------------------
    // 날짜 파싱: md 첫 줄 "date: YYYY-MM-DD" 우선, 없으면 published_at
    // --------------------------------------------------
    function parseDate(body, publishedAt) {
      if (body) {
        const match = body.match(/^date:\s*(\d{4}-\d{2}-\d{2})/m);
        if (match) {
          const [year, month, day] = match[1].split('-');
          return `${year}. ${parseInt(month)}. ${parseInt(day)}`;
        }
      }
      return new Date(publishedAt).toLocaleDateString('ko-KR');
    }

    // md 본문에서 "date:" 줄 제거
    function stripDateLine(body) {
      return (body || '').replace(/^date:.*\n?/m, '').trim();
    }

    // --------------------------------------------------
    // GitHub API 호출 (전체 릴리즈 목록)
    // --------------------------------------------------
    async function fetchReleases(repo) {
      const url = `https://api.github.com/repos/${GITHUB_USER}/${repo.id}/releases`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status}`);
      return res.json();
    }

    // --------------------------------------------------
    // 단일 릴리즈 렌더링 (최신 or 이전 버전 공통)
    // --------------------------------------------------
    function renderRelease(release, repoId, isLatest) {
      const date     = parseDate(release.body, release.published_at);
      const body     = stripDateLine(release.body);
      const noteHtml = body ? marked.parse(body) : '<p style="color:#999">릴리즈 노트 없음</p>';
      const noteId   = `note-${repoId}-${release.tag_name}`;

      const assets = release.assets.map(a =>
        `<a class="download-btn${isLatest ? '' : ' old'}" href="${a.browser_download_url}">⬇ ${a.name}</a>`
      ).join('');

      if (isLatest) {
        return `
          <div class="meta">
            최신버전: <strong>${release.tag_name}</strong>
            &nbsp;|&nbsp; 배포일: ${date}
          </div>
          <button class="toggle-btn" onclick="toggleNote('${noteId}')">
            📋 릴리즈 노트 보기 / 닫기
          </button>
          <div class="release-note" id="${noteId}" style="display:none">
            ${noteHtml}
          </div>
          <div style="margin-bottom:8px">${assets}</div>`;
      } else {
        return `
          <div class="old-release">
            <div class="old-meta">
              ${release.tag_name} &nbsp;|&nbsp; ${date}
              <button class="toggle-btn" onclick="toggleNote('${noteId}')">릴리즈 노트</button>
            </div>
            <div class="release-note" id="${noteId}" style="display:none">${noteHtml}</div>
            <div>${assets}</div>
          </div>`;
      }
    }

    // --------------------------------------------------
    // 프로젝트 카드 렌더링
    // --------------------------------------------------
    function renderProject(repo, releases) {
      // 릴리즈 없음
      if (!releases || releases.length === 0) {
        return `
          <div class="project">
            <div class="project-title">${repo.name}</div>
            <p style="color:#999">등록된 릴리즈가 없습니다.</p>
          </div>`;
      }

      const latestHtml = renderRelease(releases[0], repo.id, true);

      // 이전 버전 목록
      const olderHtml = releases.slice(1).map(r =>
        renderRelease(r, repo.id, false)
      ).join('');

      const olderSection = releases.length > 1 ? `
        <details>
          <summary>이전 버전 (${releases.length - 1}개)</summary>
          ${olderHtml}
        </details>` : '';

      return `
        <div class="project">
          <div class="project-title">${repo.name}</div>
          ${latestHtml}
          ${olderSection}
        </div>`;
    }

    // --------------------------------------------------
    // 토글 함수
    // --------------------------------------------------
    function toggleNote(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    // --------------------------------------------------
    // 좌측 카테고리 목록 렌더링
    // --------------------------------------------------
    function renderSidebar() {
      const list = document.getElementById('categoryList');
      list.innerHTML = CATEGORIES.map(cat => {
        const count = REPOS.filter(r => r.category === cat).length;
        const activeClass = cat === activeCategory ? ' active' : '';
        return `
          <li class="category-item${activeClass}" onclick="selectCategory('${cat}')">
            <span>${cat}</span><span class="category-count">${count}</span>
          </li>`;
      }).join('');
    }

    // --------------------------------------------------
    // 선택된 카테고리에 해당하는 카드만 우측에 렌더링
    // --------------------------------------------------
    function renderContent() {
      const container = document.getElementById('container');
      const html = REPOS.map((repo, i) => {
        if (repo.category !== activeCategory) return '';
        const result = repoResults[i];
        if (!result) return '';
        if (result.status === 'fulfilled') {
          return renderProject(repo, result.value);
        }
        return `
          <div class="project">
            <div class="project-title">${repo.name}</div>
            <p class="error-msg">
              릴리즈 정보를 불러올 수 없습니다. (repo명 또는 공개 설정을 확인하세요)
            </p>
          </div>`;
      }).join('');
      container.innerHTML = html || '<p class="loading">해당 카테고리에 등록된 프로젝트가 없습니다.</p>';
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderSidebar();
      renderContent();
    }

    // --------------------------------------------------
    // 초기화
    // --------------------------------------------------
    async function init() {
      renderSidebar();
      repoResults = await Promise.allSettled(REPOS.map(fetchReleases));
      renderContent();
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDeilWoiicrMR10N1on3WsYel8MAVJab1I",
      authDomain: "firmware-downloads.firebaseapp.com",
      projectId: "firmware-downloads",
      storageBucket: "firmware-downloads.firebasestorage.app",
      messagingSenderId: "1098295611802",
      appId: "1:1098295611802:web:62142bc17016fe53ffaa23"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const EMAIL_DOMAIN = '@gds-korea.com';
    let appStarted = false;

    window.login = async function () {
      const idValue  = document.getElementById('loginEmail').value.trim();
      const email    = idValue.includes('@') ? idValue : idValue + EMAIL_DOMAIN;
      const password = document.getElementById('loginPassword').value;
      const errorEl  = document.getElementById('loginError');
      errorEl.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorEl.textContent = '로그인에 실패했습니다. 이메일/비밀번호를 확인하세요.';
      }
    };

    window.logout = function () {
      signOut(auth);
    };

    onAuthStateChanged(auth, user => {
      const gate    = document.getElementById('loginGate');
      const content = document.getElementById('appContent');
      if (user) {
        gate.style.display    = 'none';
        content.style.display = 'block';
        document.getElementById('userLabel').textContent =
          (user.email || '').replace(EMAIL_DOMAIN, '');
        if (!appStarted) {
          appStarted = true;
          init();
        }
      } else {
        gate.style.display    = 'flex';
        content.style.display = 'none';
      }
    });
  </script>
</body>
</html>
